<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBS v3 · Profiles</title>
<style>
:root{--ink:#1e2330;--mute:#7b8496;--line:#e8eaee;--bg:#fff;--soft:#f5f6f8;--green:#2fa36b;--red:#e23b3b;--blue:#3d5af1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
.top{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);font-weight:700;font-size:22px}
.top svg{width:28px;height:28px}
.wrap{max-width:760px;margin:auto;padding:0 22px 60px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.tab{padding:12px 0;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-color:var(--ink)}
.prof{display:flex;align-items:center;gap:20px;margin:26px 0 10px}
.av{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:38px}
.pn{font-size:34px;font-weight:700;letter-spacing:-.5px}.ps{color:var(--mute);margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
.real{background:#e6f6ee;color:#1d7a4d}.paper{background:#eef0fb;color:#3d4bb8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:26px 0 18px}
.stats div+div{border-left:1px solid var(--line)}.sv{font-size:26px;font-weight:600}.sl{color:var(--mute);font-size:15px;margin-top:4px}
.kv{display:flex;justify-content:space-between;padding:8px 0;color:var(--mute);border-top:1px solid var(--line)}.kv b{font-weight:600;color:var(--ink)}
.box{border:1px solid var(--line);border-radius:22px;padding:22px 26px;margin-top:18px}
.bh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.bt{color:var(--mute);font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px}
.per span{padding:6px 12px;border-radius:10px;color:var(--mute);font-weight:600;cursor:pointer;font-size:15px}
.per span.on{background:#e6ecfe;color:var(--blue)}
.pnl{font-size:46px;font-weight:700;letter-spacing:-1px;margin-top:10px}.pd{color:var(--mute);margin-top:2px}
canvas{width:100%;height:190px;display:block;margin-top:16px}
.lg{display:flex;gap:18px;color:var(--mute);font-size:14px;margin-top:8px;flex-wrap:wrap}.lg i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.sub2{display:flex;gap:26px;margin-top:30px;font-size:22px;font-weight:700}.sub2 span{cursor:pointer;color:var(--mute)}.sub2 span.on{color:var(--ink)}
.it{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.it .t{font-weight:600;font-size:15px}.it .m{color:var(--mute);font-size:13px;margin-top:3px}
.r{text-align:right;white-space:nowrap}.up{color:var(--green)}.dn{color:var(--red)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}.won{background:#e6f6ee;color:#1d7a4d}.lost{background:#fdeaea;color:#b42323}.open{background:#eef0fb;color:#3d4bb8}
.foot{color:var(--mute);font-size:12px;margin-top:26px}
</style></head><body>
<div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 4v8L4 20z"/><path d="M4 4v16M20 8L4 12l16 4"/></svg>BBS v3 · Copy bots</div>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const B={polycop:{n:"PolyCop",l:"P",g:"linear-gradient(135deg,#2563eb,#60a5fa)",hex:"#3d5af1",real:1,d:"Live copy bot · New York"},
praxela:{n:"Praxela",l:"X",g:"linear-gradient(135deg,#f59e0b,#fbbf24)",hex:"#f59e0b",d:"Practice · copies like PolyCop"},
surrealexa:{n:"Surrealexa",l:"S",g:"linear-gradient(135deg,#7c3aed,#c084fc)",hex:"#8b5cf6",d:"Simulation of our own bot (Alexapoly)"}};
let D=null,cur="all",per="ALL",sub="pos";
const $=s=>document.querySelector(s),m=v=>(v<0?"-":"+")+"$"+Math.abs(v).toFixed(2),f2=v=>"$"+(+v||0).toFixed(2);
const PER={"1D":864e2,"1W":6048e2,"1M":2592e3,"ALL":1e12};
function tabs(){$("#tabs").innerHTML=[["all","All three"],...Object.keys(B).map(k=>[k,B[k].n])].map(([k,n])=>`<div class="tab ${cur==k?"on":""}" onclick="cur='${k}';render()">${n}</div>`).join("")}
function stats(b){const won=b.rows.filter(r=>r.status=="won").map(r=>r.now-r.cost),open=b.rows.filter(r=>r.status=="open");
 return{posv:open.reduce((a,r)=>a+r.now,0),big:won.length?Math.max(...won):0,n:b.copies,pnl:b.pnl,vol:b.staked,open}}
function render(){if(!D)return;tabs();const ks=cur=="all"?Object.keys(B):[cur];
 let h="";
 if(cur=="all"){h+=`<div class="stats" style="margin-top:30px">`+Object.keys(B).map(k=>{const b=D.bots[k];return`<div style="cursor:pointer" onclick="cur='${k}';render()"><div class="av" style="background:${B[k].g};width:54px;height:54px;font-size:22px;margin:0 auto 8px">${B[k].l}</div><div class="sv ${b.pnl>=0?"up":"dn"}">${m(b.pnl)}</div><div class="sl">${B[k].n}${B[k].real?' <span class="tag real">REAL</span>':' <span class="tag paper">PAPER</span>'}</div></div>`}).join("")+`</div>`}
 else{const x=B[cur],b=D.bots[cur],s=stats(b);
  h+=`<div class="prof"><div class="av" style="background:${x.g}">${x.l}</div><div><div class="pn">${x.n}<span class="tag ${x.real?"real":"paper"}">${x.real?"REAL MONEY":"PAPER"}</span></div><div class="ps">${x.d} · since Nov 7 2026</div></div></div>
  <div class="stats"><div><div class="sv">${f2(s.posv)}</div><div class="sl">Positions Value</div></div><div><div class="sv">${f2(s.big)}</div><div class="sl">Biggest Win</div></div><div><div class="sv">${s.n}</div><div class="sl">Markets Traded</div></div></div>
  <div class="kv">Total PnL<b class="${b.pnl>=0?"up":"dn"}">${m(b.pnl)}</b></div><div class="kv">Total Volume<b>${f2(b.staked)}</b></div><div class="kv">Settled<b>${b.won} won · ${b.lost} lost</b></div>`}
 const H=(D.history||[]).filter(p=>p.t>=D.updated-PER[per]);
 const val=k=>{const a=H.filter(p=>p[k]!=null);return a.length?a[a.length-1][k]-(per=="ALL"?0:a[0][k]):D.bots[k].pnl};
 const main=cur=="all"?null:val(cur);
 h+=`<div class="box"><div class="bh"><div class="bt">${main==null?"":`<span style="color:${main>=0?"var(--green)":"var(--red)"}">${main>=0?"▲":"▼"}</span>`}Profit/Loss</div>
 <div class="per">${Object.keys(PER).map(p=>`<span class="${per==p?"on":""}" onclick="per='${p}';render()">${p}</span>`).join("")}</div></div>
 ${main==null?"":`<div class="pnl">${m(main)}</div><div class="pd">${{"1D":"Past Day","1W":"Past Week","1M":"Past Month","ALL":"All Time"}[per]}</div>`}
 <canvas id="ch"></canvas>${cur=="all"?`<div class="lg">${Object.keys(B).map(k=>`<span><i style="background:${B[k].hex}"></i>${B[k].n} ${m(val(k))}</span>`).join("")}</div>`:""}</div>`;
 if(cur!="all"){const b=D.bots[cur],rows=sub=="pos"?b.rows.filter(r=>r.status=="open"):b.rows;
  h+=`<div class="sub2"><span class="${sub=="pos"?"on":""}" onclick="sub='pos';render()">Positions</span><span class="${sub=="act"?"on":""}" onclick="sub='act';render()">Activity</span></div>`+
  (rows.map(r=>`<div class="it"><div><div class="t">${r.title||"?"}</div><div class="m">${r.outcome||""} · ${r.shares.toFixed(2)} shares · ${new Date(r.ts*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}${r.tag?" · "+r.tag:""}</div></div>
  <div class="r"><div style="font-weight:600">${f2(r.now)}</div><div class="m ${r.now-r.cost>=0?"up":"dn"}">${m(r.now-r.cost)} <span class="pill ${r.status}">${r.status.toUpperCase()}</span></div></div></div>`).join("")||`<div class="it"><div class="m">Nothing here yet</div></div>`)}
 $("#view").innerHTML=h;draw(H,ks);
 $("#foot").textContent="Updated "+new Date(D.updated*1000).toLocaleString()+" · PolyCop is real money; Praxela and Surrealexa are paper (real order book, fees included). Updates every 10 min."}
function draw(H,ks){const cv=$("#ch");if(!cv)return;const r=devicePixelRatio||1,W=cv.clientWidth,Ht=190;cv.width=W*r;cv.height=Ht*r;const c=cv.getContext("2d");c.scale(r,r);
 if(H.length<2){c.fillStyle="#9aa3b2";c.font="14px sans-serif";c.fillText("The chart fills in as updates arrive.",4,30);return}
 const t0=H[0].t,t1=H[H.length-1].t;let lo=1e9,hi=-1e9;H.forEach(p=>ks.forEach(k=>{if(p[k]!=null){lo=Math.min(lo,p[k]);hi=Math.max(hi,p[k])}}));
 const pd=(hi-lo)*.15||1;lo-=pd;hi+=pd;const X=t=>W*(t-t0)/((t1-t0)||1),Y=v=>8+(Ht-16)*(hi-v)/(hi-lo);
 ks.forEach(k=>{const pts=H.filter(p=>p[k]!=null).map(p=>[X(p.t),Y(p[k])]);if(!pts.length)return;
  if(ks.length==1){const gr=c.createLinearGradient(0,0,0,Ht);gr.addColorStop(0,"rgba(99,102,241,.28)");gr.addColorStop(1,"rgba(139,92,246,0)");
   c.beginPath();c.moveTo(pts[0][0],Ht);pts.forEach(p=>c.lineTo(...p));c.lineTo(pts[pts.length-1][0],Ht);c.fillStyle=gr;c.fill();
   const lg=c.createLinearGradient(0,0,W,0);lg.addColorStop(0,"#3d5af1");lg.addColorStop(1,"#8b5cf6");c.strokeStyle=lg}else c.strokeStyle=B[k].hex;
  c.lineWidth=3;c.lineJoin="round";c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke()})}
async function load(){try{D=await (await fetch("data.json?"+Date.now())).json();render()}catch(e){$("#view").innerHTML='<p class="foot">Waiting for the first update…</p>'}}
load();setInterval(load,60000);addEventListener("resize",render);
</script></body></html>
