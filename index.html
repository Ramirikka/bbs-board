<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBS v3 · Copy bots</title>
<style>
:root{--ink:#1d1f25;--mute:#77808d;--line:#e6e8ec;--soft:#f4f5f7;--green:#3db468;--red:#e23939;--blue:#1652f0;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav .in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:22px;padding:14px 24px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}.logo svg{width:26px;height:26px}
.cats{display:flex;gap:22px;color:var(--mute);font-weight:500;overflow-x:auto}.cats span{white-space:nowrap;cursor:pointer}.cats span.on{color:var(--ink)}
.main{max-width:1200px;margin:auto;padding:22px 24px 80px}
.head{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.head{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--card)}
.who{display:flex;align-items:center;gap:16px}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;flex:none}
.nm{font-size:26px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}.real{background:#e7f6ee;color:#23824d}.paper{background:#eaf0fe;color:var(--blue)}
.st{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px}.st div+div{border-left:1px solid var(--line);padding-left:18px}
.sv{font-size:20px;font-weight:600}.sl{color:var(--mute);font-size:13px;margin-top:2px}
.kv{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}.kv b{color:var(--ink);font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:center}
.pt{display:flex;align-items:center;gap:6px;color:var(--mute);font-weight:500}
.per{display:flex;gap:2px}.per span{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}.per span.on{background:#eaf0fe;color:var(--blue)}
.pv{font-size:34px;font-weight:700;letter-spacing:-.6px;margin-top:10px}.pd{color:var(--mute);font-size:14px}
canvas{width:100%;height:120px;display:block;margin-top:12px}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mute)}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.botbar{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.bb{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;background:#fff}
.bb.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.bb .av{width:26px;height:26px;font-size:12px}
.bb .p{font-weight:600}
.tabs{display:flex;gap:26px;margin-top:30px;border-bottom:1px solid var(--line)}
.tab{padding:10px 0;font-size:18px;font-weight:700;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--ink);border-color:var(--ink)}
.tools{display:flex;gap:10px;align-items:center;margin:16px 0 4px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}.seg span{padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer}.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute)}.search input{border:0;outline:0;flex:1;font:inherit}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:right;color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:12px 8px;border-bottom:1px solid var(--line)}th:first-child{text-align:left}
td{padding:14px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;white-space:nowrap}td:first-child{text-align:left;white-space:normal}
.mk{display:flex;gap:12px;align-items:center}.ic{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none}
.mt{font-weight:600;font-size:15px;line-height:1.3}.mm{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:13px;color:var(--mute)}
.chip{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px}.yes{background:#e7f6ee;color:#23824d}.no{background:#fdecec;color:#c62828}
.val{font-weight:600}.chg{font-size:13px;margin-top:2px}.up{color:var(--green)}.dn{color:var(--red)}
.st2{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--mute)}.st2.won{background:#e7f6ee;color:#23824d}.st2.lost{background:#fdecec;color:#c62828}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.foot{color:var(--mute);font-size:12px;margin-top:24px}
@media(max-width:640px){th:nth-child(2),td:nth-child(2){display:none}.pv{font-size:28px}}
</style></head><body>
<div class="nav"><div class="in"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 3.5l16 4.2v8.6L4 20.5z"/><path d="M4 3.5v17M20 7.7L4 12l16 4.3"/></svg>BBS v3</div>
<div class="cats"><span class="on">Copy bots</span><span>PolyCop</span><span>Praxela</span><span>Surrealexa</span></div></div></div>
<div class="main">
 <div class="botbar" id="botbar"></div>
 <div class="head">
  <div class="card" id="prof"></div>
  <div class="card" id="pnlc"></div>
 </div>
 <div class="tabs"><div class="tab on" data-t="pos">Positions</div><div class="tab" data-t="act">Activity</div></div>
 <div class="tools" id="tools"></div>
 <div id="list"></div>
 <div class="foot" id="foot"></div>
</div>
<script>
const B={polycop:{n:"PolyCop",l:"P",g:"linear-gradient(135deg,#1652f0,#5c8dff)",hex:"#1652f0",real:1,d:"Live copy bot · PolyCop New York"},
praxela:{n:"Praxela",l:"X",g:"linear-gradient(135deg,#f59e0b,#fcd34d)",hex:"#f59e0b",d:"Practice bot · copies like PolyCop"},
surrealexa:{n:"Surrealexa",l:"S",g:"linear-gradient(135deg,#7c3aed,#c084fc)",hex:"#8b5cf6",d:"Simulation of our own bot (Alexa)"}};
let D,bot="polycop",per="ALL",tab="pos",seg="active",q="";
const $=s=>document.querySelector(s),usd=v=>(v<0?"-":"")+"$"+Math.abs(v).toFixed(2),sg=v=>(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2),c=p=>p==null?"—":(p*100).toFixed(p*100%1?1:0)+"¢";
const PER={"1D":864e2,"1W":6048e2,"1M":2592e3,"ALL":1e13};
const tm=t=>new Date(t*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
function render(){if(!D)return;const x=B[bot],b=D.bots[bot]||{rows:[]};
 $("#botbar").innerHTML=Object.keys(B).map(k=>{const v=D.bots[k]||{};return`<div class="bb ${k==bot?"on":""}" onclick="bot='${k}';render()"><div class="av" style="background:${B[k].g}">${B[k].l}</div>${B[k].n}<span class="p ${v.pnl>=0?"up":"dn"}">${sg(v.pnl||0)}</span></div>`}).join("");
 document.querySelectorAll(".cats span").forEach((e,i)=>{e.className=(i==0?bot=="all":Object.keys(B)[i-1]==bot)?"on":"";e.onclick=()=>{if(i)bot=Object.keys(B)[i-1];render()}});
 const open=b.rows.filter(r=>r.status=="open"),won=b.rows.filter(r=>r.status=="won").map(r=>r.now-r.cost);
 $("#prof").innerHTML=`<div class="who"><div class="av" style="background:${x.g}">${x.l}</div><div><div class="nm">${x.n}<span class="badge ${x.real?"real":"paper"}">${x.real?"REAL MONEY":"PAPER"}</span></div><div class="sub">${x.d} · since Nov 2026</div></div></div>
 <div class="st"><div><div class="sv">${usd(open.reduce((a,r)=>a+r.now,0))}</div><div class="sl">Positions Value</div></div><div><div class="sv">${won.length?usd(Math.max(...won)):"—"}</div><div class="sl">Biggest Win</div></div><div><div class="sv">${b.copies||0}</div><div class="sl">Markets Traded</div></div></div>
 <div class="kv">Total PnL<b class="${b.pnl>=0?"up":"dn"}">${sg(b.pnl||0)}</b></div><div class="kv" style="border:0;margin-top:6px;padding-top:0">Total Volume<b>${usd(b.staked||0)}</b></div><div class="kv" style="border:0;margin-top:6px;padding-top:0">Settled<b>${b.won||0} won · ${b.lost||0} lost</b></div>`;
 const H=(D.history||[]).filter(p=>p.t>=D.updated-PER[per]),pts=H.filter(p=>p[bot]!=null);
 const val=pts.length?(per=="ALL"?b.pnl:pts[pts.length-1][bot]-pts[0][bot]):b.pnl;
 $("#pnlc").innerHTML=`<div class="ph"><div class="pt"><span class="${val>=0?"up":"dn"}">${val>=0?"▲":"▼"}</span>Profit/Loss</div><div class="per">${["1D","1W","1M","ALL"].map(p=>`<span class="${per==p?"on":""}" onclick="per='${p}';render()">${p}</span>`).join("")}</div></div>
 <div class="pv">${sg(val)}</div><div class="pd">${{"1D":"Past Day","1W":"Past Week","1M":"Past Month","ALL":"All Time"}[per]}</div><canvas id="ch"></canvas>
 <div class="lg">${Object.keys(B).map(k=>`<span><i style="background:${B[k].hex};opacity:${k==bot?1:.35}"></i>${B[k].n}</span>`).join("")}</div>`;
 draw(H);
 document.querySelectorAll(".tab").forEach(e=>{e.className="tab"+(e.dataset.t==tab?" on":"");e.onclick=()=>{tab=e.dataset.t;render()}});
 $("#tools").innerHTML=tab=="pos"?`<div class="seg"><span class="${seg=="active"?"on":""}" onclick="seg='active';render()">Active</span><span class="${seg=="closed"?"on":""}" onclick="seg='closed';render()">Closed</span></div><label class="search">⌕<input id="q" placeholder="Search positions" value="${q}"></label>`:"";
 const qi=$("#q");if(qi){qi.oninput=e=>{q=e.target.value;list()};}
 list();
 $("#foot").textContent="Updated "+new Date(D.updated*1000).toLocaleString()+" · PolyCop is real money; Praxela and Surrealexa are paper trades (real order book, fees included). Refreshes every 2 minutes.";
}
function list(){const b=D.bots[bot]||{rows:[]};let h="";
 if(tab=="pos"){let rows=b.rows.filter(r=>seg=="active"?r.status=="open":r.status!="open").filter(r=>(r.title||"").toLowerCase().includes(q.toLowerCase()));
  rows.sort((a,z)=>z.now-a.now);
  h=rows.length?`<table><tr><th>Market</th><th>Avg</th><th>${seg=="active"?"Current":"Result"}</th><th>Value</th></tr>`+rows.map(r=>{const d=r.now-r.cost,pc=r.cost?d/r.cost*100:0,yes=/^(yes|over|up)/i.test(r.outcome||"")||!/^(no|under|down)/i.test(r.outcome||"");
  return`<tr><td><a class="mk" href="https://polymarket.com/market/${r.slug||""}" target="_blank">${r.icon?`<img class="ic" src="${r.icon}" loading="lazy">`:`<div class="ic"></div>`}<div><div class="mt">${r.title||"?"}</div>
  <div class="mm"><span class="chip ${yes?"yes":"no"}">${r.outcome||""} ${c(r.avg)}</span>${r.shares.toFixed(1)} shares${r.tag?" · "+r.tag:""}</div></div></a></td>
  <td>${c(r.avg)}</td><td>${seg=="active"?c(r.price_now):`<span class="st2 ${r.status}">${r.status.toUpperCase()}</span>`}</td>
  <td><div class="val">${usd(r.now)}</div><div class="chg ${d>=0?"up":"dn"}">${sg(d)} (${pc.toFixed(2)}%)</div></td></tr>`}).join("")+`</table>`:`<div class="empty">No ${seg} positions</div>`}
 else{const rows=[...b.rows].sort((a,z)=>z.ts-a.ts);
  h=rows.length?`<table><tr><th>Type</th><th>Market</th><th>Amount</th><th>Time</th></tr>`+rows.map(r=>`<tr><td><b>Buy</b></td><td style="text-align:left;white-space:normal"><div class="mk">${r.icon?`<img class="ic" src="${r.icon}" style="width:36px;height:36px" loading="lazy">`:""}<div><div class="mt">${r.title||"?"}</div><div class="mm"><span class="chip ${/^(no|under|down)/i.test(r.outcome||"")?"no":"yes"}">${r.outcome||""} ${c(r.avg)}</span>${r.shares.toFixed(1)} shares${r.tag?" · "+r.tag:""}</div></div></div></td><td class="val">${usd(r.cost)}</td><td style="color:var(--mute)">${tm(r.ts)}</td></tr>`).join("")+`</table>`:`<div class="empty">No activity yet</div>`}
 $("#list").innerHTML=h}
function draw(H){const cv=$("#ch"),r=devicePixelRatio||1,W=cv.clientWidth,Ht=120;cv.width=W*r;cv.height=Ht*r;const g=cv.getContext("2d");g.scale(r,r);
 const ks=Object.keys(B);if(H.length<2){g.fillStyle="#9aa3b2";g.font="13px Inter,sans-serif";g.fillText("Chart fills in as updates arrive",0,60);return}
 const t0=H[0].t,t1=H[H.length-1].t;let lo=1e9,hi=-1e9;H.forEach(p=>ks.forEach(k=>{if(p[k]!=null){lo=Math.min(lo,p[k]);hi=Math.max(hi,p[k])}}));
 const pd=(hi-lo)*.12||1;lo-=pd;hi+=pd;const X=t=>W*(t-t0)/((t1-t0)||1),Y=v=>6+(Ht-12)*(hi-v)/(hi-lo);
 [...ks.filter(k=>k!=bot),bot].forEach(k=>{const P=H.filter(p=>p[k]!=null).map(p=>[X(p.t),Y(p[k])]);if(!P.length)return;
  if(k==bot){const gr=g.createLinearGradient(0,0,0,Ht);gr.addColorStop(0,"rgba(22,82,240,.20)");gr.addColorStop(1,"rgba(139,92,246,0)");g.beginPath();g.moveTo(P[0][0],Ht);P.forEach(p=>g.lineTo(...p));g.lineTo(P[P.length-1][0],Ht);g.fillStyle=gr;g.fill();
   const lg=g.createLinearGradient(0,0,W,0);lg.addColorStop(0,"#1652f0");lg.addColorStop(1,"#8b5cf6");g.strokeStyle=lg;g.lineWidth=2.5;g.globalAlpha=1}else{g.strokeStyle=B[k].hex;g.lineWidth=1.5;g.globalAlpha=.3}
  g.beginPath();P.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.globalAlpha=1})}
async function load(){try{D=await (await fetch("https://raw.githubusercontent.com/Ramirikka/bbs-board/data/data.json?"+Date.now(),{cache:"no-store"}).catch(()=>fetch("data.json?"+Date.now()))).json();render()}catch(e){$("#list").innerHTML='<div class="empty">Waiting for the first update…</div>'}}
load();setInterval(load,60000);addEventListener("resize",()=>D&&render());
</script></body></html>
